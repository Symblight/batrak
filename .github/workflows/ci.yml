name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          deps-token: ${{ secrets.DEPS_TOKEN }}

      - run: pnpm typecheck

      # Ubuntu 24.04's AppArmor blocks the user namespaces Chrome's sandbox needs.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm test

  backend:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          deps-token: ${{ secrets.DEPS_TOKEN }}

      # tauri::generate_context! embeds dist/ at compile time, tests included.
      - run: pnpm build
        working-directory: .

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --lib
