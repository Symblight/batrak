name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag, package.json $pkg, Cargo.toml $cargo: bump both before tagging"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
          # The oldest supported runner: a binary runs only on a glibc at least as new as its build's.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      # One draft release that every platform uploads to; publish it by hand after a check.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signature until there is a Developer ID certificate (Apple Silicon refuses
          # unsigned apps); Gatekeeper still quarantines the download.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Batrak v__VERSION__
          releaseBody: |
            - **macOS:** download `Batrak_*_universal.dmg`, open it and drag Batrak into Applications.
              This build is not notarized yet: on first launch macOS reports it as damaged. Run
              `xattr -dr com.apple.quarantine /Applications/Batrak.app` once, then open it.
            - **Windows:** run the `.exe` or `.msi` installer. It is not signed yet, so SmartScreen
              may warn about it.
            - **Linux:** use the `.AppImage`, `.deb` or `.rpm`.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
