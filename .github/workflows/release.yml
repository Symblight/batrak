name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          cli=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/cli/Cargo.toml | head -1)
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ] || [ "$tag" != "$cli" ]; then
            echo "::error::Tag v$tag, package.json $pkg, desktop Cargo.toml $cargo, CLI Cargo.toml $cli: bump all three before tagging"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust-targets: aarch64-apple-darwin
          - rust-targets: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Two targets share a runner OS and a job: without a key they would share a cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust-targets }}

      # One draft release that both targets upload to; publish it by hand after a check.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signature until there is a Developer ID certificate (Apple Silicon refuses
          # unsigned apps); Gatekeeper still quarantines the download.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Batrak v__VERSION__
          releaseBody: |
            Download `Batrak_*_aarch64.dmg` for Apple Silicon (M1 and newer) or `Batrak_*_x64.dmg`
            for Intel, open it and drag Batrak into Applications.
            This build is not notarized yet: on first launch macOS reports it as damaged. Run
            `xattr -dr com.apple.quarantine /Applications/Batrak.app` once, then open it.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: false
          # Only the .dmg goes to the release: no updater bundle (.app.tar.gz and its .sig).
          args: >-
            --target ${{ matrix.rust-targets }} --bundles dmg
            --config {"bundle":{"createUpdaterArtifacts":false}}
