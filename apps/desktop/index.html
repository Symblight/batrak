    <title>Batrak</title>

  <body>
    <!-- Splash: <acp-app> is a light-DOM view, which clears what is inside it before it renders, so the logo disappears then. -->
    <acp-app>
      <img
        src="/favicon.svg"
        alt=""
        width="96"
        height="96"
        style="position: fixed; inset: 0; margin: auto"
      />
    </acp-app>
  </body>
