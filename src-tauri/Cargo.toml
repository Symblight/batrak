[package]
name = "brama"
version = "0.1.0"
description = "Brama — agent-first client for AI coding agents"
edition = "2021"

[workspace]
# Each agent is a crate (spec: docs/specs/agent-plugins.md); all are default members, so
# `cargo test --lib` and `cargo clippy --all-targets` here check every one.
members = ["crates/*"]
default-members = [".", "crates/*"]

[lib]
name = "brama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-api = { path = "crates/agent-api" }
agent-acp = { path = "crates/agent-acp" }
agent-antigravity = { path = "crates/agent-antigravity" }
agent-claude = { path = "crates/agent-claude" }
agent-codex = { path = "crates/agent-codex" }
agent-copilot = { path = "crates/agent-copilot" }
agent-generic = { path = "crates/agent-generic" }
agent-kit = { path = "crates/agent-kit" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2"
# Workspace snapshot: ignore-aware walk + file watching
ignore = "0.4"
notify = "8"
notify-debouncer-full = "0.7"
# Quick Open (fzf-style fuzzy scoring)
nucleo-matcher = "0.3"
# Find in Files (ripgrep as a library)
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
# canonicalize without Windows' `\\?\` prefix, in which `/` is not a separator
dunce = "1"
# Settings > Font: installed font families (the webview has no font enumeration API)
fontdb = "0.24"
# Logs: daily files in the app log dir (plus stderr in dev), panics included
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ACP host: the official SDK (pinned: its API changes between majors), driven over the agent's
# stdio by tokio (futures I/O through tokio-util's compat layer)
agent-client-protocol = "=3.3.0"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
# `${keychain:name}` in agents.json env values
keyring = "4.2"
# Terminal tabs: the user's shell in a pseudo-terminal
portable-pty = "0.9"
# The ACP agent registry (config/registry.rs only): fetched over rustls, versions compared by semver
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver = "1"
# Accent-insensitive agent search (NFD); already in the tree through url/idna
icu_normalizer = "2"

# Stopping a timed-out commit's process group (git and its hooks)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Future dependencies:
# rusqlite = { version = "0.32", features = ["bundled"] }
# git2 = "0.19"
# similar = "2"

# Optimize dependencies in dev builds: fuzzy matching, regex and directory walking are
# 10x slower unoptimized, which makes Quick Open lag in `tauri dev`. Our own crate stays debug.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
agent-acp = { path = "crates/agent-acp", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
