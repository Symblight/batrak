[package]
name = "brama"
version = "0.1.0"
description = "Brama — agent-first client for AI coding agents"
edition = "2021"

[lib]
name = "brama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Workspace snapshot: ignore-aware walk + file watching
ignore = "0.4"
notify = "8"
notify-debouncer-full = "0.7"
# Quick Open (fzf-style fuzzy scoring)
nucleo-matcher = "0.3"
# Find in Files (ripgrep as a library)
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
# canonicalize without Windows' `\\?\` prefix, in which `/` is not a separator
dunce = "1"
# Settings > Font: installed font families (the webview has no font enumeration API)
fontdb = "0.24"
# Logs: daily files in the app log dir (plus stderr in dev), panics included
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Future dependencies:
# rusqlite = { version = "0.32", features = ["bundled"] }
# git2 = "0.19"
# similar = "2"
# tokio = { version = "1", features = ["full"] }
# portable-pty = "0.8"
# agent-client-protocol = "0"

# Optimize dependencies in dev builds: fuzzy matching, regex and directory walking are
# 10x slower unoptimized, which makes Quick Open lag in `tauri dev`. Our own crate stays debug.
[profile.dev.package."*"]
opt-level = 2
