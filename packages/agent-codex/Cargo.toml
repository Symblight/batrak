[package]
name = "agent-codex"
version = "0.1.0"
edition = "2021"
description = "Codex for Batrak: codex-acp, a library over Codex's threads, whose CLI is @openai/codex"

[dependencies]
agent-api = { path = "../agent-api" }
agent-kit = { path = "../agent-kit" }
# Its rollouts' turn events
serde_json = "1"

[dev-dependencies]
agent-api = { path = "../agent-api", features = ["test-support"] }
